# بدون دامنه: سرور مستقیماً با آی‌پی سرور در دسترس است، فقط روی HTTP (بدون SSL،
# چون Let's Encrypt برای صدور گواهی به یک دامنه نیاز دارد نه آی‌پی خام).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # آپلود اکسل تا ۲۵ مگابایت مجاز است؛ پیش‌فرض nginx یک مگابایت است و آپلود را می‌شکند
    client_max_body_size 30m;

    # داده منابع انسانی است — بدون این، هر کسی با آی‌پی سرور می‌تواند فایل آپلود و مشاهده کند.
    # توجه: چون HTTPS نیست، این رمز روی شبکه به‌صورت متن ساده رد و بدل می‌شود.
    auth_basic "HR Analytics";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
